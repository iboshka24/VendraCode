# Nginx Reverse Proxy Configuration for brain.vendra.uz
# This does NOT affect or touch your main website (vendra.uz / www.vendra.uz)

server {
    listen 80;
    server_name brain.vendra.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name brain.vendra.uz;

    # SSL Certificates (managed automatically by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/brain.vendra.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.vendra.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:4000;
        
        # Crucial for WebSockets (live git sync, cursor streaming, lock events)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for real-time agent syncing
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
